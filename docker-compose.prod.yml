# Production stack for ecom.work.gd.
#
# Nginx on the host proxies HTTPS traffic to localhost:8080 (shop)
# and localhost:5000 (API).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file: ./ecommerce-backend/.env
    environment:
      MYSQL_USER: ecommerce
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./ecommerce-backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: ./ecommerce-backend/.env
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"
      MONGO_URI: mongodb://mongo:27017/ecommerce_db
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ecommerce
      CLIENT_URL: https://ecom.work.gd
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongo:
        condition: service_started
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./ecommerce-frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: https://ecom.work.gd/api
        VITE_SOCKET_URL: https://ecom.work.gd
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

volumes:
  mongo_data:
  mysql_data:
