# Production stack. Images are already on Docker Hub, so this file only pulls them.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Shop: http://localhost
# API:  http://localhost:5000

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file: ./ecommerce-backend/.env
    environment:
      MYSQL_USER: ecommerce
    ports:
      - "3306:3306" # Workbench on this PC uses localhost:3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: sumit9911/markethouse-api:1.0-prod
    restart: unless-stopped
    env_file: ./ecommerce-backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/ecommerce_db
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      # The production shop is on port 80, so the browser origin is http://localhost.
      CLIENT_URL: http://localhost
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_started
      mysql:
        condition: service_healthy

  web:
    image: sumit9911/markethouse-web:1.0-prod
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  mongo_data:
  mysql_data:
